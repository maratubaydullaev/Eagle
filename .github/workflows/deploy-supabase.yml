name: Deploy POCHEMUCHKA Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN is not configured; deployment is skipped."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.available == 'true'
        with:
          version: 2.117.0
      - name: Link project
        if: steps.credentials.outputs.available == 'true'
        run: supabase link --project-ref xqcexaewqxzvzzfddkjv
      - name: Deploy Edge Functions
        if: steps.credentials.outputs.available == 'true'
        run: supabase functions deploy --use-api
