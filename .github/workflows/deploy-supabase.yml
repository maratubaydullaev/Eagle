name: Deploy POCHEMUCHKA Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: xqcexaewqxzvzzfddkjv
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GitHub Secret is missing."
            echo "Create it in GitHub: Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Deploy Edge Functions
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"
