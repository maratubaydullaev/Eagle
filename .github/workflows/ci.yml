name: POCHEMUCHKA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/telegram-auth/index.ts supabase/functions/pochemuchka-api/index.ts
