name: Deploy POCHEMUCHKA Database

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: xqcexaewqxzvzzfddkjv
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GitHub Secret is missing."
            exit 1
          fi

      - name: Apply MVP database migration
        shell: bash
        run: |
          set -euo pipefail
          SQL_FILE="supabase/migrations/20260919210000_mvp_data_consistency_and_gift_transactions.sql"
          if [ ! -f "$SQL_FILE" ]; then
            echo "Migration file not found: $SQL_FILE"
            exit 1
          fi

          jq -n --rawfile query "$SQL_FILE" '{query: $query}' > payload.json

          curl --fail-with-body --silent --show-error             --request POST             --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query"             --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             --header "Content-Type: application/json"             --data-binary @payload.json
